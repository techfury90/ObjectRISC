# oriscdir.default.conf — the canonical Ouroboros directory layout.
#
# Loaded by passing `--config` to oriscdir. Lines are blank, comments
# (#), or directives. The grammar today is one directive — see the
# top-of-file docstring in tools/devices/oriscdir for syntax.
#
# This is the small assumption every Ouroboros system makes about its
# namespace, factored out of the supervisor and into the daemon that
# actually owns the namespace. Adding a CPU mid-run via oriscadd, or
# bringing the leader up cold, both result in a system where
# /programs is already mounted by the time anyone needs to spawn
# anything from it.

# /programs is the standard hostfsd-backed program directory. The
# leader's hostfsd self-registers at /sys/hostfsd/0; we mount it at
# /programs with the prefix /programs so a walk for
# /programs/sysinit.orx returns prefix='/programs',
# leftover='sysinit.orx', and shells / orx_spawn forward the joined
# path back to hostfsd to actually open the file.
mount /programs /sys/hostfsd/0 /programs

# /fonts serves the on-disk WMF1 font objects (fonts/*.wmf, committed at the
# repo root = the hostfsd jail root) for dynamic font loading. Same deferred-
# mount onto /sys/hostfsd/0 as /programs: a walk for /fonts/luRS.wmf returns
# prefix='/fonts', leftover='luRS.wmf', and the WM forwards the joined path to
# hostfsd to open the blob, then loads it into a renderable font object.
mount /fonts /sys/hostfsd/0 /fonts

# /docs serves the repo's documentation (docs/*.md, committed under the hostfsd
# jail root) so the Markdown viewer can hf_open a real .md. Same deferred-mount
# onto /sys/hostfsd/0 as /fonts: a walk for /docs/CONTRACT.md returns
# prefix='/docs', leftover='CONTRACT.md', and the client forwards the joined
# path to hostfsd to open the file.
mount /docs /sys/hostfsd/0 /docs
